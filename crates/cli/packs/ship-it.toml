# Built-in command pack (ADR 0013 §5).
# Dev culture: tickets, standups, deploys and postmortems.
# Built into the shimmer binary; unbranded by rule. Each alias runs shimmer plus the whole
# command, e.g. the activate alias with an id runs 'shimmer workspaces activate <id>'.

[pack]
id = "ship-it"
label = "Ship It"

[alias]
"on-call"    = "core.ping"
"ooo"        = "core.shutdown"
"readme"     = "core.manifest"
"boards"     = "records.collections"
"ticket"     = "records.add"
"triage"     = "records.list"
"blame"      = "records.get"
"amend"      = "records.update"
"lgtm"       = "records.complete"
"wontfix"    = "records.remove"
"envs"       = "workspaces.list"
"standup"    = "workspaces.status"
"deploy"     = "workspaces.activate"
"postmortem" = "workspaces.cleanup"
"force-push" = "workspaces.force_relaunch"
"rollback"   = "workspaces.reset"
