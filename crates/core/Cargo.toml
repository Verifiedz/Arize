[package]
name = "swe-core"
description = "Shared contract: Module trait, Ctx, Event, Task, ids, errors. Depends on nothing internal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# In-memory Ctx, store and sink for module tests (CLAUDE.md §12 rule 13).
testing = []

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "macros"] }
tokio-util = "0.7"
ulid = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
