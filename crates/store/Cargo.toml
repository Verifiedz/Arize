[package]
name = "shimmer-store"
description = "Files (truth) + SQLite index (derived). Atomic transactions, event log, recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
shimmer-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
ulid = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
