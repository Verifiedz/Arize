# Monorepo: several apps from one repo, started together, with their logs side by side.
# Created from Shimmer's monorepo template. It's your folder now: edit it freely.
#
#   shimmer workspaces activate <id> --wait     start every app and open it all
#   shimmer workspaces stop <id> --wait         stop every app and the services, close what it can,
#                                               and list what it closed and what it left open
#   shimmer workspaces reconfigure <id>         change your answers (the [env] table at the bottom)
#
# "auto" is worked out each time it opens, from the repo itself (turbo.json, nx.json,
# pnpm-workspace.yaml, package.json workspaces, Cargo.toml [workspace], go.work).
#
# Never put API keys or passwords in [env]: this file lives in your Shimmer folder, which is
# meant to be copied between machines and committed to git.
#
# Each app's output goes to $TMPDIR/shimmer-<id>/dev-<app>.log (or /tmp/…).

[workspace]
label = "Monorepo"
description = "Several apps from one repo, with their logs side by side"

[[step]]
name = "check"
description = "The folder, tool, editor and terminal exist, and the ports are free"
mode = "supervised"
timeout_s = 20

[[step]]
name = "git"
description = "Pull the latest code when there are no local changes"
mode = "supervised"
timeout_s = 60

[[step]]
name = "install"
description = "One install at the root when the lockfile changed"
mode = "supervised"
timeout_s = 900

[[step]]
name = "services"
description = "Start services the apps need (SERVICES_COMMAND)"
mode = "supervised"
timeout_s = 120

[[step]]
name = "editor"
description = "Open the editor on the repo"
mode = "detached"

[[step]]
name = "dev"
description = "Start every app's dev server"
mode = "detached"

[[step]]
name = "wait"
description = "Wait until every local URL answers"
mode = "supervised"
timeout_s = 180

[[step]]
name = "browser"
description = "Open the apps, the live site, the repository and your links"
mode = "detached"

[[step]]
name = "logs"
description = "A terminal following every app's logs"
mode = "detached"

[[step]]
name = "terminal"
description = "Another terminal running TERMINAL_COMMAND"
mode = "detached"

[cleanup]
timeout_s = 60
