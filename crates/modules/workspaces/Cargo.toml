[package]
name = "shimmer-workspaces"
description = "The workspaces module (CLAUDE.md §10). State machine, workspace.toml parser (ADR 0012) and the module. Depends on core only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
shimmer-core = { path = "../../core" }
async-trait = "0.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
shimmer-core = { path = "../../core", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt"] }
tokio-util = "0.7"
