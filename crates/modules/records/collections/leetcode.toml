# Built in. Written to $SHIMMER_HOME/data/records/collections/ on first start; edit it freely there.

[collection]
id = "leetcode"
label = "LeetCode"
# How a problem is named in reminders and notifications (ADR 0017).
title = "{title}"
# `records.complete` sets this field to today's date.
stamp_on_complete = "last_solved"

[[field]]
name = "title"
type = "string"
required = true

[[field]]
name = "difficulty"
type = "enum"
values = ["easy", "medium", "hard"]

[[field]]
name = "url"
type = "string"

[[field]]
name = "last_solved"
type = "date"

[[view]]
kind = "heatmap"
source = "last_solved"
